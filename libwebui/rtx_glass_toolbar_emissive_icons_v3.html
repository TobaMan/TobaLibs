<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#eef2f7;color:#111827;background-image:linear-gradient(rgba(15,23,42,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.055) 1px,transparent 1px);background-size:28px 28px}

<script>
const $=id=>document.getElementById(id),MAT={diffuse:0,mirror:1,glass:2,glossy:3,emissive:4};let rtx=null,fx=null;const RANGE=60;
function edt1(f,n){const d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);let k=0;v[0]=0;z[0]=-1e20;z[1]=1e20;for(let q=1;q<n;q++){let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k])}k++;v[k]=q;z[k]=s;z[k+1]=1e20}k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const x=q-v[k];d[q]=x*x+f[v[k]]}return d}

function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]}
function shape(ctx,name,L,T,W,H){ctx.beginPath();if(name==='play'){ctx.moveTo(L+W*.25,T+H*.12);ctx.lineTo(L+W*.88,T+H*.5);ctx.lineTo(L+W*.25,T+H*.88);ctx.closePath()}else if(name==='plus'){ctx.rect(L+W*.43,T+H*.12,W*.14,H*.76);ctx.rect(L+W*.12,T+H*.43,W*.76,H*.14)}else if(name==='diamond'){ctx.moveTo(L+W*.5,T+H*.08);ctx.lineTo(L+W*.92,T+H*.5);ctx.lineTo(L+W*.5,T+H*.92);ctx.lineTo(L+W*.08,T+H*.5);ctx.closePath()}else if(name==='pause'){ctx.rect(L+W*.22,T+H*.12,W*.2,H*.76);ctx.rect(L+W*.58,T+H*.12,W*.2,H*.76)}else{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=(i%2?W*.19:W*.46),x=L+W*.5+Math.cos(a)*rr,y=T+H*.5+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}ctx.fill()}
function buildIcons(){const icons=Array.from(document.querySelectorAll('.icon-html')),vw=innerWidth,vh=innerHeight,cv=rtx&&rtx.canvas,w=cv&&cv.width?cv.width:vw,h=cv&&cv.height?cv.height:vh,s=w/vw,c=$('sdf');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true}),idx=document.createElement('canvas');idx.width=w;idx.height=h;const ix=idx.getContext('2d',{willReadFrequently:true});x.fillStyle='#000';x.fillRect(0,0,w,h);ix.fillStyle='#000';ix.fillRect(0,0,w,h);icons.forEach((el,k)=>{const r=el.getBoundingClientRect(),L=r.left*s,T=r.top*s,W=r.width*s,H=r.height*s;x.fillStyle='#fff';shape(x,el.dataset.shape,L,T,W,H);ix.fillStyle='rgb('+((k+1)*32)+',0,0)';shape(ix,el.dataset.shape,L,T,W,H)});const px=x.getImageData(0,0,w,h).data,id=ix.getImageData(0,0,w,h).data,inside=new Uint8Array(w*h),outside=new Uint8Array(w*h),who=new Int8Array(w*h).fill(-1);for(let p=0;p<w*h;p++){inside[p]=px[p*4]>128?1:0;outside[p]=inside[p]?0:1;if(inside[p])who[p]=Math.max(0,Math.round(id[p*4]/32)-1)}const dout=edt2(inside,w,h),din=edt2(outside,w,h),im=x.createImageData(w,h);for(let p=0;p<w*h;p++){const sd=inside[p]?-din[p]:dout[p],e=Math.max(0,Math.min(1,sd/(2*RANGE)+.5)),o=p*4;im.data[o]=Math.round(e*255);im.data[o+1]=who[p]>=0?who[p]+1:0;im.data[o+3]=255}x.putImageData(im,0,0);return{canvas:c,glyphs:icons.map(el=>({color:hex(el.dataset.color),mat:MAT[$('iconMat').value]}))}}
function amb(){const a=parseFloat($('ambient').value);return[a,a,a]}
function refresh(){if(!rtx||rtx._rad)return;rtx.updateSceneFromDOM();const a=buildIcons();rtx.setGlyphs(a.canvas,a.glyphs,RANGE,.08,1.5)}
function stop(){if(rtx&&rtx.destroy)rtx.destroy();rtx=null;if(fx)fx.destroy();fx=null}
function start(){stop();document.querySelector('.toolbar').classList.toggle('mode-rad',$('engine').value==='rad');if($('engine').value==='rad'){fx=new GridCraftHtmlEffects({mode:'radiance',targets:['.gc-surface','.icon-html'],autoStart:true,overlay:{opacity:parseFloat($('radOpacity').value),blendMode:$('blend').value,zIndex:3},performance:{qualityScale:parseFloat($('radQuality').value)},radiance:{maxAlpha:parseFloat($('radIntensity').value)}});fx.start();rtx={_rad:true,frameCount:0,scene:[],destroy(){fx&&fx.destroy()}};return}const E=$('engine').value==='rt'?window.RTX_Realtime:window.RTX_Quality;rtx=new E('rtxCanvas',{domSelector:'.gc-surface',renderScale:$('engine').value==='rt'?parseFloat($('scale').value):1,maxBounces:parseInt($('bounces').value),temporalAlpha:parseFloat($('temporal').value),denoiseEnabled:$('denoise').checked,denoiseStrength:parseFloat($('force').value),denoiseRadius:parseFloat($('radius').value),settleProfile:'quality-burst'});rtx.setBackgroundColor(amb());rtx.setEmissivePower(parseFloat($('emission').value));rtx.setFrontEmission(parseFloat($('front').value));rtx.setBloom($('bloom').checked,.55,.62);if(rtx.setAces)rtx.setAces($('aces').checked,parseFloat($('expo').value));if(rtx.setGlossyFresnel)rtx.setGlossyFresnel($('fresnel').checked,parseFloat($('fresnelPow').value));requestAnimationFrame(refresh)}
$('start').onclick=start;$('stop').onclick=stop;$('engine').onchange=start;$('buttonMat').onchange=e=>{document.querySelectorAll('.glass-button').forEach(b=>b.dataset.rtxMaterial=e.target.value);refresh()};$('iconMat').onchange=refresh;$('htmlOpacity').oninput=e=>{document.querySelectorAll('.icon-html').forEach(i=>i.style.opacity=e.target.value);document.querySelectorAll('.glass-button').forEach(b=>b.style.opacity=Math.max(.12,parseFloat(e.target.value)))};$('blend').onchange=e=>{$('rtxCanvas').style.mixBlendMode=e.target.value;if(fx)start()};
['scale','bounces','temporal','denoise','force','radius','ambient','emission','front','bloom','aces','expo','fresnel','fresnelPow'].forEach(id=>$(id).oninput=()=>{if(id==='scale'&&rtx&&rtx.setRenderScale&&$('engine').value==='rt'){rtx.setRenderScale(parseFloat($('scale').value));requestAnimationFrame(refresh)}else if(rtx&&!rtx._rad)start()});['radQuality','radIntensity','radOpacity'].forEach(id=>$(id).oninput=()=>{if(fx)start()});
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(refresh,100)});function tick(){$('status').textContent=rtx?('V3 '+($('engine').value.toUpperCase())+' frame='+(rtx.frameCount||0)+' objets='+(rtx.scene?rtx.scene.length:0)):'off';requestAnimationFrame(tick)}tick();setTimeout(start,100);
