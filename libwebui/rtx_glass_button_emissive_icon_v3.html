<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>V3 - Bouton verre et icone emissive</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#eef2f7;color:#111827;background-image:linear-gradient(rgba(15,23,42,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.055) 1px,transparent 1px);background-size:28px 28px}
.toolbar{position:fixed;inset:0 0 auto;z-index:5000;background:#111827;color:white;padding:9px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}.toolbar label{display:flex;gap:5px;align-items:center}.toolbar input[type=range]{width:100px}.rad-only{display:none}.toolbar.mode-rad .rad-only{display:flex}.toolbar.mode-rad .pt-only{display:none}#status{margin-left:auto;font:11px Consolas,monospace;opacity:.85}
.stage{position:fixed;inset:82px 0 0;display:grid;place-items:center}.stack{position:relative;width:280px;height:150px;display:grid;place-items:center}
.icon-html{position:absolute;z-index:1;width:72px;height:72px;background:#ff4d31;clip-path:polygon(22% 10%,90% 50%,22% 90%);filter:drop-shadow(0 0 16px rgba(255,77,49,.9));pointer-events:none}
.glass-button{position:absolute;z-index:2;width:260px;height:126px;border-radius:34px;background:rgba(224,247,255,.22);border:1px solid rgba(255,255,255,.9);box-shadow:0 22px 58px rgba(15,23,42,.18);cursor:pointer}
.glass-button:active{transform:scale(.985)}.label{position:absolute;top:calc(100% + 24px);font-size:13px;color:#64748b;white-space:nowrap}
#rtxCanvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none;mix-blend-mode:normal}
</style></head><body>
<div class="toolbar">
<button id="start">Demarrer</button><button id="stop">Stop</button>
<label>Moteur <select id="engine"><option value="rt">RTX realtime V3</option><option value="quality">RTX quality V3</option><option value="rad">Radiance</option></select></label>
<label class="rad-only">Qualite <input id="radQuality" type="range" min=".25" max="1" step=".05" value=".6"></label><label class="rad-only">Intensite <input id="radIntensity" type="range" min=".1" max="1" step=".05" value=".6"></label><label class="rad-only">Opacite <input id="radOpacity" type="range" min=".1" max="1" step=".05" value=".85"></label>
<label>Bouton <select id="buttonMat"><option>diffuse</option><option>mirror</option><option selected>glass</option><option>glossy</option><option>emissive</option></select></label>
<label>Icone <select id="iconMat"><option>diffuse</option><option>mirror</option><option>glass</option><option>glossy</option><option selected>emissive</option></select></label>
<label>Opacite HTML <input id="htmlOpacity" type="range" min="0" max="1" step=".02" value=".32"></label>
<label>Blend <select id="blend"><option selected>normal</option><option>screen</option><option>multiply</option><option>plus-lighter</option><option>overlay</option></select></label>
<label class="pt-only">Resolution <input id="scale" type="range" min=".3" max="1" step=".05" value=".55"></label><label class="pt-only">Bounces <input id="bounces" type="range" min="1" max="5" step="1" value="4"></label><label class="pt-only">Temporal <input id="temporal" type="range" min="0" max=".55" step=".01" value="0"></label>
<label class="pt-only">SVGF <input id="denoise" type="checkbox" checked></label><label class="pt-only">Force <input id="force" type="range" min="0" max="1" step=".02" value=".86"></label><label class="pt-only">Rayon <input id="radius" type="range" min=".5" max="3" step=".1" value="1.8"></label>
<label>Ambiance <input id="ambient" type="range" min="0" max="1" step=".05" value=".85"></label><label class="pt-only">Emissive <input id="emission" type="range" min="0" max="8" step=".2" value="3"></label><label class="pt-only">Front <input id="front" type="range" min="0" max="3" step=".1" value="1"></label><label class="pt-only">Bloom <input id="bloom" type="checkbox" checked></label><label class="pt-only">ACES <input id="aces" type="checkbox"></label><label class="pt-only">Expo <input id="expo" type="range" min=".5" max="4" step=".1" value="1.6"></label><label class="pt-only">Fresnel <input id="fresnel" type="checkbox" checked></label><label class="pt-only">Force Fr <input id="fresnelPow" type="range" min="0" max="1" step=".05" value=".6"></label><span id="status">off</span>
</div>
<main class="stage"><div class="stack"><div id="icon" class="icon-html"></div><button id="glass" class="glass-button gc-surface" data-rtx-material="glass" data-rtx-ior="1.5" aria-label="Lecture"></button><div class="label">Icône émissive SDF sous une surface de bouton en verre</div></div></main>
<canvas id="rtxCanvas"></canvas><canvas id="sdf" hidden></canvas>
<script src="file:///C:/Toba/modules/libwebui/vendor/gridcraft/Raytracer_Engine_Realtime_V3.js"></script><script src="file:///C:/Toba/modules/libwebui/vendor/gridcraft/Raytracer_Engine_V3.js"></script><script src="file:///C:/Toba/modules/libwebui/vendor/gridcraft/Radiance_Cascade_Engine.js"></script><script src="file:///C:/Toba/modules/libwebui/vendor/gridcraft/GridCraftHtmlEffects.js"></script>
<script>
const $=id=>document.getElementById(id),MAT={diffuse:0,mirror:1,glass:2,glossy:3,emissive:4};let rtx=null,fx=null;const RANGE=60;
function edt1(f,n){const d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);let k=0;v[0]=0;z[0]=-1e20;z[1]=1e20;for(let q=1;q<n;q++){let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k])}k++;v[k]=q;z[k]=s;z[k+1]=1e20}k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const x=q-v[k];d[q]=x*x+f[v[k]]}return d}
function edt2(bin,w,h){const f=new Float64Array(w*h),col=new Float64Array(h),row=new Float64Array(w);for(let i=0;i<f.length;i++)f[i]=bin[i]?0:1e20;for(let x=0;x<w;x++){for(let y=0;y<h;y++)col[y]=f[y*w+x];const d=edt1(col,h);for(let y=0;y<h;y++)f[y*w+x]=d[y]}for(let y=0;y<h;y++){for(let x=0;x<w;x++)row[x]=f[y*w+x];const d=edt1(row,w);for(let x=0;x<w;x++)f[y*w+x]=Math.sqrt(d[x])}return f}
function buildIcon(){const vw=innerWidth,vh=innerHeight,cv=rtx&&rtx.canvas,w=cv&&cv.width?cv.width:vw,h=cv&&cv.height?cv.height:vh,s=w/vw,c=$('sdf');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#000';x.fillRect(0,0,w,h);const r=$('icon').getBoundingClientRect(),L=r.left*s,T=r.top*s,W=r.width*s,H=r.height*s;x.fillStyle='#fff';x.beginPath();x.moveTo(L+W*.22,T+H*.10);x.lineTo(L+W*.90,T+H*.50);x.lineTo(L+W*.22,T+H*.90);x.closePath();x.fill();const px=x.getImageData(0,0,w,h).data,inside=new Uint8Array(w*h),outside=new Uint8Array(w*h);for(let p=0;p<w*h;p++){inside[p]=px[p*4]>128?1:0;outside[p]=inside[p]?0:1}const dout=edt2(inside,w,h),din=edt2(outside,w,h),im=x.createImageData(w,h);for(let p=0;p<w*h;p++){const sd=inside[p]?-din[p]:dout[p],e=Math.max(0,Math.min(1,sd/(2*RANGE)+.5)),o=p*4;im.data[o]=Math.round(e*255);im.data[o+1]=inside[p]?1:0;im.data[o+3]=255}x.putImageData(im,0,0);return c}
function amb(){const a=parseFloat($('ambient').value);return[a,a,a]}
function refresh(){if(!rtx||rtx._rad)return;rtx.updateSceneFromDOM();rtx.setGlyphs(buildIcon(),[{color:[1,.12,.035],mat:MAT[$('iconMat').value]}],RANGE,.08,1.5)}
function stop(){if(rtx&&rtx.destroy)rtx.destroy();rtx=null;if(fx)fx.destroy();fx=null}
function start(){stop();document.querySelector('.toolbar').classList.toggle('mode-rad',$('engine').value==='rad');if($('engine').value==='rad'){fx=new GridCraftHtmlEffects({mode:'radiance',targets:['.gc-surface','#icon'],autoStart:true,overlay:{opacity:parseFloat($('radOpacity').value),blendMode:$('blend').value,zIndex:3},performance:{qualityScale:parseFloat($('radQuality').value)},radiance:{maxAlpha:parseFloat($('radIntensity').value)}});fx.start();rtx={_rad:true,frameCount:0,scene:[],destroy(){fx&&fx.destroy()}};return}const E=$('engine').value==='rt'?window.RTX_Realtime:window.RTX_Quality;rtx=new E('rtxCanvas',{domSelector:'.gc-surface',renderScale:$('engine').value==='rt'?parseFloat($('scale').value):1,maxBounces:parseInt($('bounces').value),temporalAlpha:parseFloat($('temporal').value),denoiseEnabled:$('denoise').checked,denoiseStrength:parseFloat($('force').value),denoiseRadius:parseFloat($('radius').value),settleProfile:'quality-burst'});rtx.setBackgroundColor(amb());rtx.setEmissivePower(parseFloat($('emission').value));rtx.setFrontEmission(parseFloat($('front').value));rtx.setBloom($('bloom').checked,.55,.62);if(rtx.setAces)rtx.setAces($('aces').checked,parseFloat($('expo').value));if(rtx.setGlossyFresnel)rtx.setGlossyFresnel($('fresnel').checked,parseFloat($('fresnelPow').value));requestAnimationFrame(refresh)}
$('start').onclick=start;$('stop').onclick=stop;$('engine').onchange=start;$('buttonMat').onchange=e=>{$('glass').dataset.rtxMaterial=e.target.value;refresh()};$('iconMat').onchange=refresh;$('htmlOpacity').oninput=e=>{$('icon').style.opacity=e.target.value;$('glass').style.opacity=Math.max(.12,parseFloat(e.target.value))};$('blend').onchange=e=>{$('rtxCanvas').style.mixBlendMode=e.target.value;if(fx)start()};
['scale','bounces','temporal','denoise','force','radius','ambient','emission','front','bloom','aces','expo','fresnel','fresnelPow'].forEach(id=>$(id).oninput=()=>{if(id==='scale'&&rtx&&rtx.setRenderScale&&$('engine').value==='rt'){rtx.setRenderScale(parseFloat($('scale').value));requestAnimationFrame(refresh)}else if(rtx&&!rtx._rad)start()});['radQuality','radIntensity','radOpacity'].forEach(id=>$(id).oninput=()=>{if(fx)start()});
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(refresh,100)});function tick(){$('status').textContent=rtx?('V3 '+($('engine').value.toUpperCase())+' frame='+(rtx.frameCount||0)+' objets='+(rtx.scene?rtx.scene.length:0)):'off';requestAnimationFrame(tick)}tick();setTimeout(start,100);
</script></body></html>
